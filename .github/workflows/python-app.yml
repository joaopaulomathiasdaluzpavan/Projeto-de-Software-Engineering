name: Python application

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest  # Certifique-se de ter o pytest instalado
    - name: Run tests
      run: |
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest customtkinter Pillow
        pytest
